# Public API behind Caddy (automatic HTTPS). Run from the repo root on the server:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# deploy/.env needs API_DOMAIN and WEB_ORIGIN (see deploy/.env.example); LLM keys stay in the root .env.
services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file: ../.env
    environment:
      PUBLIC_MODE: "1"
      DEMO_MODE: cached
      WEB_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN in deploy/.env}
    volumes:
      - ../api/data:/srv/api/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
