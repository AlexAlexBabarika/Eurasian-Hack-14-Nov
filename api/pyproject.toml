[project]
name = "groundtruth-api"
version = "0.1.0"
description = "Groundtruth: privacy policy vs. code auditor"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.2",
    "playwright>=1.48",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "sse-starlette>=2.1",
    "trafilatura>=1.12",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
