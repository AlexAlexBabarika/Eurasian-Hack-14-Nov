- id: KZ-CP-25
  jurisdiction: KZ
  area: consumer
  instrument: "Law of the Republic of Kazakhstan No. 274-IV 'On Protection of Consumer Rights' (4 May 2010)"
  ref: "Art. 25"
  title: "Seller's duty to provide information"
