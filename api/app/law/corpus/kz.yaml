- id: KZ-PD-7
  jurisdiction: KZ
  area: personal_data
  instrument: "Law of the Republic of Kazakhstan No. 94-V 'On Personal Data and their Protection' (21 May 2013)"
  ref: "Art. 7"
  title: "Conditions for collection and processing"
  summary: "Collection and processing of personal data is carried out with the consent of the subject, except in cases set by law. Transfer to third parties and cross-border transfer are subject to consent."
  official_url: "https://adilet.zan.kz/eng/docs/Z1300000094"
  tags: [consent, lawfulness, sharing, recipients, processors, cookies, tracking]
  verified: false
- id: KZ-PD-8
  jurisdiction: KZ
  area: personal_data
  instrument: "Law of the Republic of Kazakhstan No. 94-V 'On Personal Data and their Protection' (21 May 2013)"
  ref: "Art. 8(4)"
  title: "Required content of consent"
  summary: "Consent must state, among other things, its validity period, whether data may be transferred to third parties, whether cross-border transfer takes place, and the list of data collected."
  official_url: "https://adilet.zan.kz/eng/docs/Z1300000094"
  tags: [consent, recipients, processors, transfers, data_categories, retention, transparency, sharing]
  verified: false
- id: KZ-PD-12-2
  jurisdiction: KZ
  area: personal_data
  instrument: "Law of the Republic of Kazakhstan No. 94-V 'On Personal Data and their Protection' (21 May 2013)"
  ref: "Art. 12(2)"
  title: "Storage in Kazakhstan and retention period"
  summary: "Personal data must be stored in a database or digital facility located in the territory of Kazakhstan. The retention period is set by the date the purposes of collection and processing are achieved."
  official_url: "https://adilet.zan.kz/eng/docs/Z1300000094"
  tags: [localisation, transfers, retention]
  verified: false
- id: KZ-PD-16
  jurisdiction: KZ
  area: personal_data
  instrument: "Law of the Republic of Kazakhstan No. 94-V 'On Personal Data and their Protection' (21 May 2013)"
  ref: "Art. 16"
  title: "Cross-border transfer"
  summary: "Cross-border transfer is allowed only to states that ensure protection of personal data, or otherwise on limited grounds such as the subject's consent to the cross-border transfer."
  official_url: "https://adilet.zan.kz/eng/docs/Z1300000094"
  tags: [transfers]
  verified: false
- id: KZ-PD-24
  jurisdiction: KZ
  area: personal_data
  instrument: "Law of the Republic of Kazakhstan No. 94-V 'On Personal Data and their Protection' (21 May 2013)"
  ref: "Art. 24"
  title: "Rights of the subject"
  summary: "The subject has rights including to know what personal data the owner or operator holds, to require changes, blocking and destruction of data in cases set by law, and to withdraw consent."
  official_url: "https://adilet.zan.kz/eng/docs/Z1300000094"
  tags: [erasure, deletion, rights]
  verified: false
- id: KZ-PD-25
  jurisdiction: KZ
  area: personal_data
  instrument: "Law of the Republic of Kazakhstan No. 94-V 'On Personal Data and their Protection' (21 May 2013)"
  ref: "Art. 25"
  title: "Duties of the owner and operator"
  summary: "The owner or operator must take legal, organisational and technical measures to protect personal data, be able to evidence consent, give the subject access to their data, and destroy data in the cases set by law."
  official_url: "https://adilet.zan.kz/eng/docs/Z1300000094"
  tags: [security, logs, erasure, deletion, consent]
  verified: false
- id: KZ-AI-21-1
  jurisdiction: KZ
  area: ai_transparency
  instrument: "Law of the Republic of Kazakhstan No. 230-VIII 'On Artificial Intelligence' (17 November 2025, in force 18 January 2026)"
  ref: "Art. 21(1)"
  title: "Users must be informed that AI is used"
  summary: "Users must be informed that goods, works and services are produced or provided using artificial intelligence systems."
  official_url: "https://adilet.zan.kz/eng/docs/Z2500000230"
  tags: [ai, transparency, chatbot]
  verified: false
- id: KZ-AI-21-2
  jurisdiction: KZ
  area: ai_transparency
  instrument: "Law of the Republic of Kazakhstan No. 230-VIII 'On Artificial Intelligence' (17 November 2025, in force 18 January 2026)"
  ref: "Art. 21(2)-(3)"
  title: "Synthetic results must be labelled"
  summary: "Synthetic results of AI systems may be distributed only with machine-readable labelling and a warning the user can perceive. Owners or holders of the AI system are responsible for informing users."
  official_url: "https://adilet.zan.kz/eng/docs/Z2500000230"
  tags: [ai, synthetic]
  verified: false
- id: KZ-AI-16
  jurisdiction: KZ
  area: ai_transparency
  instrument: "Law of the Republic of Kazakhstan No. 230-VIII 'On Artificial Intelligence' (17 November 2025, in force 18 January 2026)"
  ref: "Art. 16(1)"
  title: "User rights when interacting with AI systems"
  summary: "Users have the right to read the user agreement of the AI system, to protection of their personal data processed by it, to explanations of results affecting their rights, and to refuse to interact with an AI system where interaction is not mandatory by law."
  official_url: "https://adilet.zan.kz/eng/docs/Z2500000230"
  tags: [ai, transparency, rights, chatbot]
  verified: false
