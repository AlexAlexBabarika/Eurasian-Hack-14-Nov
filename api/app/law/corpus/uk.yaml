- id: UK-PECR-6
  jurisdiction: UK
  area: personal_data
  instrument: "Privacy and Electronic Communications (EC Directive) Regulations 2003 (PECR)"
  ref: "reg. 6(1), as substituted by Data (Use and Access) Act 2025 s. 112"
  title: "Storing or accessing information on a user's device"
  summary: "A person must not store information, or gain access to information stored, in a user's terminal equipment unless an exception in Schedule A1 applies (for example consent, or strict necessity)."
  official_url: "https://www.legislation.gov.uk/ukpga/2025/18/section/112"
  tags: [cookies, consent, tracking]
  verified: true
- id: UK-PECR-SCHA1-5
  jurisdiction: UK
  area: personal_data
  instrument: "PECR Schedule A1, inserted by Data (Use and Access) Act 2025 Sch. 12"
  ref: "Sch. A1 para. 5"
  title: "Statistical-purposes exception for analytics cookies"
  summary: "Consent is not required where the sole purpose of the storage or access is to collect information for statistical purposes about how the service or website is used, with a view to improving it, provided the information is not shared with anyone else except to help make those improvements, the user is given clear and comprehensive information about the purpose, and the user is given a simple, free means of objecting and does not object."
  official_url: "https://www.legislation.gov.uk/ukpga/2025/18/schedule/12"
  tags: [cookies, consent, tracking, statistical, analytics]
  verified: true
