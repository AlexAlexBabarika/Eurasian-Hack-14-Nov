- id: UK-DMCC-226
  jurisdiction: UK
  area: consumer
  instrument: "Digital Markets, Competition and Consumers Act 2024, Part 4 Chapter 1"
  ref: "s. 226"
  title: "Misleading actions"
  summary: "A practice involves a misleading action if it involves providing false or misleading information relating to a product, a trader or any other matter relevant to a transactional decision, or an overall presentation likely to deceive the average consumer. Under s. 225(4)(a) it is unfair if it is likely to cause the average consumer to take a transactional decision they would not otherwise have taken."
  official_url: "https://www.legislation.gov.uk/ukpga/2024/13/section/226"
  tags: [misleading, sharing, fairness]
  verified: true
- id: UK-DMCC-227
  jurisdiction: UK
  area: consumer
  instrument: "Digital Markets, Competition and Consumers Act 2024, Part 4 Chapter 1"
  ref: "s. 227"
  title: "Misleading omissions"
  summary: "A practice involves a misleading omission if it omits or hides material information the average consumer needs to take an informed transactional decision."
  official_url: "https://www.legislation.gov.uk/ukpga/2024/13/section/227"
  tags: [misleading, information, erasure, omission]
