- id: UK-GDPR-22
  jurisdiction: UK
  area: personal_data
  instrument: "UK GDPR (Regulation (EU) 2016/679 as retained in UK law)"
  ref: "Arts. 22A-22C"
  title: "Automated decision-making"
  summary: "A significant decision (one with a legal or similarly significant effect) taken solely by automated processing, with no meaningful human involvement, requires safeguards: the person must be given information about it and be able to make representations, obtain human intervention and contest the decision (Art. 22C). Such decisions based on special category data are restricted further (Art. 22B). Arts. 22A-22D replaced Art. 22 on 5 February 2026 (Data (Use and Access) Act 2025, s. 80)."
  official_url: "https://www.legislation.gov.uk/eur/2016/679/article/22C"
  tags: [automated_decisions]
  verified: false
