- id: UK-GDPR-44A
  jurisdiction: UK
  area: personal_data
  instrument: "UK GDPR (Regulation (EU) 2016/679 as retained in UK law)"
  ref: "Art. 44A"
  title: "General principles for transfers"
  summary: "A controller or processor may transfer personal data to a third country or international organisation only if the transfer is approved by regulations under Article 45A, is subject to appropriate safeguards (Article 46), or relies on a derogation (Article 49), and complies with the other provisions of the UK GDPR."
  official_url: "https://www.legislation.gov.uk/eur/2016/679/article/44A"
  tags: [transfers]
  verified: false
